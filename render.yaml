# Render Blueprint: New > Blueprint > pick this repo. Secrets marked sync: false are entered in the Render dashboard.
services:
  - type: web
    name: emechanicz-crm-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths:
        - backend/**
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: SUPABASE_URL
        value: https://rtdesrjmyapfgxrownur.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
